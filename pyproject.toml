[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
	"slow: real-data regression fits, skipped by default (use --run-slow to include)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
	"E",  # pycodestyle errors
	"F",  # pyflakes
	"I",  # import sorting
	"UP", # pyupgrade
	"B",  # flake8-bugbear
]
ignore = [
	"E501", # line-length handled by formatter/editor policy
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402", "F401", "F811"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
