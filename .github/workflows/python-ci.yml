name: Python CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project (editable) and test dependencies
        run: |
          python -m pip install -e .
          python -m pip install pandas pyarrow planetaryimage pvl requests matplotlib duckdb astropy hypothesis pytest ruff

      - name: Print Python version and installed packages
        run: |
          python --version
          python -m pip list

      - name: Run tests
        run: |
          pytest tests/ -vv

      - name: Lint (report only, does not fail the build)
        if: always()
        continue-on-error: true
        run: |
          ruff check src/ tests/ scripts/
