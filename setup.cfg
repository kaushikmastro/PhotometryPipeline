[metadata]
name = vesta_photometry_pipeline
version = 0.1.0
author = Kaushik Mukherjee
description = Photometric pipeline for airless-body surface reflectance: SPICE-based geometry ingestion (photometry_etl) and Hapke/baseline photometric modeling and fitting (photometry)
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.11
install_requires =
    numpy
    scipy
    pymc
    spiceypy

[options.packages.find]
where = src
